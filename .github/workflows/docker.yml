name: docker

# Builds and pushes the pir image to GHCR (GitHub Container Registry):
#   ghcr.io/<owner>/pir:<tag>
# Release-only: runs exclusively on v* tag pushes, so no container
# build/push/upload happens outside an actual release. Always on a
# GitHub-hosted runner — the self-hosted runner is for testing only.
#   v* tag push -> :1.2.3 and :1.2 semver tags, plus :main (docker-compose.yml
#                  pins ghcr.io/beiyanpiki/pir:main, so every release
#                  republishes it to keep `docker compose pull` on the
#                  release line)
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # github.repository == <owner>/pir -> image name matches the repo
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # docker-compose.yml pins ghcr.io/beiyanpiki/pir:main — republish
            # :main on every release so `docker compose pull` tracks the
            # release line (this workflow only fires on v* tags now).
            type=raw,value=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
