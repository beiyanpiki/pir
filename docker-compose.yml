# pir service — HTTPS executor over a mounted project.
#
#   echo "PIR_SERVER_TOKEN=$(openssl rand -hex 16)" >> .env
#   echo "BIGMODEL_API_KEY=<your bigmodel coding-plan key>" >> .env
#   docker compose up -d
#   pir --server https://localhost:8790 --token "$PIR_SERVER_TOKEN" --insecure find --json
#
# - Project is mounted at /workspace; all pir state lands in <project>/.pir/
#   (PIR_STATE_IN_PROJECT=1), so the sqlite memory survives with your repo.
# - Model access uses pi's built-in zai-coding-cn provider (official GLM
#   coding endpoint, open.bigmodel.cn); the key is injected from the
#   environment by the entrypoint — never baked into the image.
# - Public egress only: standard bridge networking with a mapped port.
services:
  pir:
    build: .
    image: pir:latest
    init: true
    environment:
      - PIR_SERVER_TOKEN=${PIR_SERVER_TOKEN:?set PIR_SERVER_TOKEN in .env}
      - BIGMODEL_API_KEY=${BIGMODEL_API_KEY:?set BIGMODEL_API_KEY in .env}
      - PIR_STATE_IN_PROJECT=1
    volumes:
      - ${PIR_WORKSPACE:-..}:/workspace
      - ./docker/pi-config:/pi-config:ro
    ports:
      - "8790:8790"
    command: ["serve"]
