# pir service — HTTPS review executor.
#
#   sh docker/deploy.sh        # interactive QA deployment (recommended)
#   # or by hand:
#   echo "PIR_SERVER_TOKEN=$(openssl rand -hex 16)" >> .env
#   echo "BIGMODEL_API_KEY=<key>" >> .env
#   docker compose up -d
#
# Reviews arrive either as client-side git bundles (POST /v1/review — local
# unpushed state, no server credentials needed) or through repos registered
# with `pir repos add` (PIR_REPOS_ROOT). Memory concentrates under
# PIR_STATE_ROOT/<projectId>/; both live in named volumes.
services:
  pir:
    # Prebuilt image from GHCR; comment out to build locally instead.
    image: ghcr.io/beiyanpiki/pir:main
    build: .
    init: true
    environment:
      - PIR_SERVER_TOKEN=${PIR_SERVER_TOKEN:?set PIR_SERVER_TOKEN in .env}
      - BIGMODEL_API_KEY=${BIGMODEL_API_KEY:?set BIGMODEL_API_KEY in .env}
      - PIR_REPOS_ROOT=/data/repos
      - PIR_STATE_ROOT=/data/state
    volumes:
      - ./docker/pi-config:/pi-config:ro
      - pir-repos:/data/repos
      - pir-state:/data/state
    ports:
      - "${PIR_PORT:-8790}:8790"
    command: ["serve"]

volumes:
  pir-repos:
  pir-state:
